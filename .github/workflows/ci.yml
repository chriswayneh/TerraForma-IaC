name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest -q
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv .package-smoke
      - run: .package-smoke/bin/python -m pip install dist/*.whl fastapi uvicorn
      - run: .package-smoke/bin/terraforma --version
      - run: >-
          .package-smoke/bin/python -c
          "from fastapi.testclient import TestClient;
          from terraforma.web import create_app;
          client = TestClient(create_app(), base_url='http://127.0.0.1');
          assert client.get('/').status_code == 200;
          assert client.get('/static/app.js').status_code == 200"
  native-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6
        with:
          tflint_version: 'v0.61.0'
      - run: python -m pip install -e ".[dev]"
      - name: Prepare the native provider cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          printf 'TF_PLUGIN_CACHE_DIR=%s/terraform-plugin-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: python -m pytest tests/test_generator.py tests/test_network_inputs.py tests/test_images.py tests/test_admin_username.py tests/test_aws_placement.py -q
        env:
          TERRAFORMA_NATIVE_TESTS: '1'
      - name: Prepare a cloud-free Action smoke configuration
        run: >-
          python -c
          "from pathlib import Path;
          root = Path('.verification/action-smoke');
          root.mkdir(parents=True, exist_ok=True);
          (root / 'main.tf').write_text('terraform {\n  required_version = \"' + '>= 1.6' + '\"\n}\n', encoding='utf-8')"
      - name: Verify the composite Action
        uses: ./
        with:
          target_dir: .verification/action-smoke
