name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m venv .package-smoke
      - run: .package-smoke/bin/python -m pip install dist/*.whl fastapi uvicorn
      - run: .package-smoke/bin/terraforma --version
      - run: >-
          .package-smoke/bin/python -c
          "from fastapi.testclient import TestClient;
          from terraforma.web import create_app;
          client = TestClient(create_app(), base_url='http://127.0.0.1');
          assert client.get('/').status_code == 200;
          assert client.get('/static/app.js').status_code == 200"
  native-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: 'v0.61.0'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_generator.py -q
        env:
          TERRAFORMA_NATIVE_TESTS: '1'
