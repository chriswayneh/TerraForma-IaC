name: Bug report
description: Report an issue with generation, validation, or the local UI.
body:
  - type: markdown
    attributes:
      value: Remove credentials, state data, and sensitive values from all shared output.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include provider, workload, access settings, and the command or UI step.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Terraform version, and TFLint version.
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      render: text
