name: 'TerraForma IaC Safeguard'
# SECURITY: validation runs `terraform init` and `tflint --init` on target_dir, which downloads and
# executes the providers, modules and TFLint plugins that the directory declares. Do not run this
# Action on untrusted pull-request code in `pull_request_target`/`workflow_run` workflows or in any
# job that has secrets (including openai_api_key), cloud credentials or write permissions.
# See docs/VALIDATION.md#github-action.
description: 'Validates trusted Terraform with terraform validate and TFLint, with optional AI explanations. Not for untrusted PR code.'
author: 'chriswayneh'
inputs:
  openai_api_key:
    description: 'API key required to translate raw terminal execution error dumps'
    required: false
  target_dir:
    description: 'The target directory containing the HCL scripts to validate'
    required: false
    default: '.'
  explain_with_ai:
    description: 'Explicitly send redacted failed validation logs to OpenAI (true or false)'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python Runtime Environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: '1.14.0'
        terraform_wrapper: false

    - name: Set up TFLint
      uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6
      with:
        tflint_version: 'v0.61.0'

    - name: Standardize Python Package Dependencies
      shell: bash
      env:
        TERRAFORMA_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install "$TERRAFORMA_ACTION_PATH"

    - name: Execute Local Infrastructure Pipeline Checks
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        TERRAFORMA_TARGET_DIR: ${{ inputs.target_dir }}
        TERRAFORMA_EXPLAIN_WITH_AI: ${{ inputs.explain_with_ai }}
      run: |
        case "$TERRAFORMA_EXPLAIN_WITH_AI" in
          true) terraforma run --dir "$TERRAFORMA_TARGET_DIR" --ai ;;
          false) terraforma run --dir "$TERRAFORMA_TARGET_DIR" --no-ai ;;
          *) echo 'explain_with_ai must be true or false'; exit 1 ;;
        esac
