name: 'TerraForma IaC Safeguard'
description: 'Validates workspace configurations, executes linter checks, and translates failures using AI.'
author: 'chriswayneh'
inputs:
  openai_api_key:
    description: 'API key required to translate raw terminal execution error dumps'
    required: false
  target_dir:
    description: 'The target directory containing the HCL scripts to validate'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.14.0'
        terraform_wrapper: false

    - name: Set up TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: 'v0.61.0'

    - name: Standardize Python Package Dependencies
      shell: bash
      env:
        TERRAFORMA_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install "$TERRAFORMA_ACTION_PATH"
        
    - name: Execute Local Infrastructure Pipeline Checks
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        TERRAFORMA_TARGET_DIR: ${{ inputs.target_dir }}
      run: |
        terraforma run --dir "$TERRAFORMA_TARGET_DIR"
