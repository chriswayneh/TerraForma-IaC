[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraforma-iac"
version = "0.4.0.dev0"
description = "A lightweight local workspace for guided Terraform generation and validation."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "questionary>=2.0.0,<3",
    "click>=8.1.0,<9",
    "httpx>=0.27.0,<1",
    "pydantic>=2.6.0,<3"
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.9", "python-hcl2>=7.0", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.package-data]
terraforma = ["static/*.html", "static/*.css", "static/*.js", "static/*LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[project.scripts]
terraforma = "terraforma.cli:main"
